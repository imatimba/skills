name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Lint find-pi-packages
        working-directory: skills/find-pi-packages
        run: npx oxlint --deny-warnings
      - name: Test find-pi-packages
        working-directory: skills/find-pi-packages
        run: node --test
